<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reconize — Mice</title>
<link rel="stylesheet" href="/mice.css">
<script src="/mice.js"></script>
<!--
  THE FACE APP, from our side. This page opens Reconize, says whether it is
  running, and polls the watcher to report if the rig is watching.
  The greeting, the rules and the numbers arrive in later steps
  (see docs/system_integral.html).

  Addresses come from config/partners.json, through /api/partners - the same
  one list everything else that talks to an outside app reads. Moving Reconize
  to another port is one edit there and no code here. Passwords are NOT in that
  file and never will be: every file in an app folder is served without a
  login, and a partner entry holds addresses only.
-->

<!-- The same head every app page has (Cameras, Voice): Hub button, title,
     status, technical switch. Asked 2026-09-17: *why UI it not the same as
     other? make it like other.* -->
<div class="head">
  <button class="secondary" onclick="location.href='/'">🏠 Hub</button>
  <h1>👁 Reconize</h1>
  <span class="mini">the face app that knows who is here</span>
  <label class="mini" style="display:inline-flex;gap:var(--sp-2);align-items:center;margin-left:auto">
    <input type="checkbox" id="advOn" onchange="miceAdv.set(this.checked)">
    Show technical details</label>
</div>
<!-- No hub login here (user 2026-09-17): Reconize has its own login, and
     opening it from this PC needs none. The hub still asks a caller on the
     network, in main.py. -->

<div class="card">
  <h2>Open it</h2>
  <p class="mini" id="whatIs">Reconize runs beside Mice on this PC. It watches the
    cameras and knows who is who; the rig follows it.</p>
  <div class="row">
    <button class="primary" id="openBtn" onclick="openApp()">Open Reconize</button>
    <button id="checkBtn" onclick="probe()">Check it is running</button>
    <span class="statline" id="stat" role="status" aria-live="polite">checking…</span>
  </div>
  <div class="statline tech mini" id="where"></div>
  <!-- Reconize itself, inside this page, once it answers. -->
  <div id="frameCard" style="margin-top:var(--sp-3)" hidden>
    <iframe id="reconFrame" title="Reconize" src="about:blank"
            style="width:100%;height:75vh;border:1px solid var(--line);border-radius:var(--r-md)"></iframe>
  </div>
</div>

<div class="card">
  <h2>Is the rig following it?</h2>
  <div class="row" style="align-items:baseline">
    <span class="statline" id="wStat" role="status" aria-live="polite">checking…</span>
  </div>
  <div id="wSrcs" class="tech" style="margin-top:var(--sp-4); display:none">
    <p class="mini">What each source can report:</p>
    <ul class="mini" id="wSrcList" style="list-style:inside; margin-top:var(--sp-2)"></ul>
  </div>
</div>

<script>
// WHICH outside program this tile is for. One name, so a second tile is a copy
// of this file with a different name in it and no new code anywhere.
const PARTNER = "reconize";
let links = null;

// The addresses come from config/partners.json through /api/partners - the ONE
// list, shared with the watcher and everything else that talks to an outside
// app. This page used to keep its own links.json beside it; two lists disagree
// the first time one of them is edited.
async function load(){
  let all;
  try{
    all = await fetch("/api/partners", {cache: "no-store"}).then(r => r.json());
  }catch(e){
    say("cannot ask the hub where Reconize lives — is the hub still running?");
    return;
  }
  if (!all.ok){
    say("the list of outside apps could not be read.",
        all.error || "config/partners.json");
    return;
  }
  links = (all.partners || {})[PARTNER];
  if (!links){
    say("config/partners.json has no entry called " + PARTNER +
        " — add one and this button works, with no code change.");
    return;
  }
  const w = document.getElementById("where");
  w.textContent = "app " + links.open + " · api " + links.api;
  // Opening the page is asking for Reconize: start it if it is silent.
  ensureRunning().catch(err =>
    say(...(Array.isArray(err) ? err : ["Reconize could not be started.", String(err)])));
  pollWatcher();
}

function say(msg, tech){
  const el = document.getElementById("stat");
  el.textContent = msg;
  if (tech){
    const t = document.createElement("span");
    t.className = "tech mini";
    t.textContent = " " + tech;
    el.appendChild(t);
  }
}

// Starts Reconize (Main, never Dummy) through the hub when it is silent and
// waits until it answers. Returns where it answered; throws [words, detail].
let starting = null;
function ensureRunning(){
  if (!starting) starting = startLoop().finally(() => { starting = null; });
  return starting;
}
async function startLoop(){
    const until = Date.now() + 120000;     // a cold face model can be slow
    let got;
    while (true){
      try{
        const r = await fetch("/api/partners/start?id=" + PARTNER,
                              {method: "POST", cache: "no-store"});
        got = await r.json();
      }catch(e){
        throw ["cannot reach the hub — is it still running?", String(e.message || e)];
      }
      if (got.need_login) throw ["Reconize can only be started from the PC that runs Mice, or after signing in on the hub page."];
      if (!got.ok) throw [got.error || "Reconize could not be started.", [].concat(got.log || []).join(" ")];
      if (got.ready) break;
      say("starting Reconize… (" + got.starting.join(", ") + ") — this takes about fifteen seconds",
          "log " + [].concat(got.log || []).join(" "));
      if (Date.now() > until) throw ["Reconize is taking too long to start.", [].concat(got.log || []).join(" ")];
      await new Promise(res => setTimeout(res, 2000));
    }
    // Where it really answered this time - their port can change with an update.
    const where = got.open || links.open;
    say("Reconize is running.", where);
    showFrame(where);
    return where;
}

function showFrame(where){
  const frame = document.getElementById("reconFrame");
  if (frame.src === "about:blank") frame.src = where;
  document.getElementById("frameCard").hidden = false;
}

// The tab is opened NOW, inside the click: a tab opened after a wait is
// blocked as a pop-up.
async function openApp(){
  if (!links) return say("the addresses have not loaded yet — try again in a moment");
  const btn = document.getElementById("openBtn");
  btn.disabled = true;
  const tab = window.open("about:blank", "_blank");
  try{
    const where = await ensureRunning();
    if (tab && !tab.closed) tab.location.href = where;
    else window.open(where, "_blank");
  }catch(err){
    if (tab && !tab.closed) tab.close();
    say(...(Array.isArray(err) ? err : ["Reconize could not be started.", String(err)]));
  }finally{
    btn.disabled = false;
  }
}

// Its /api/health needs no login (their main.py:182). A browser can reach it
// directly, so this page does not need the hub for the one thing it does today.
async function probe(){
  if (!links) return;
  say("checking…");
  try{
    const r = await fetch(links.api + links.health, {cache: "no-store"});
    say(r.ok ? "Reconize is running." : "Reconize answered, but not happily.",
        "HTTP " + r.status);
  }catch(e){
    // A cold start loads a face model first - about fifteen seconds - so "not
    // answering" is not the same as "not started".
    say("Reconize is not running. Press Open Reconize and it starts by itself.",
        String(e.message || e));
  }
}

async function pollWatcher() {
  const el = document.getElementById("wStat");
  const srcs = document.getElementById("wSrcs");
  const list = document.getElementById("wSrcList");
  try {
    // The watcher binds to loopback only.
    const r = await fetch("http://localhost:8769/state", {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const state = await r.json();
    
    el.textContent = state.watching ? "Yes - the rig sees who arrives." : "Not yet - the rig is not seeing anybody arrive.";
    el.className = state.watching ? "statline ok" : "statline warn";

    if (state.sources && state.sources.length > 0) {
      srcs.style.display = "block";
      list.innerHTML = "";
      for (const s of state.sources) {
        const li = document.createElement("li");
        const cam = s.hasCamera ? "📷 has camera" : "no camera";
        const rep = s.reports && s.reports.length ? s.reports.join(", ") : "nothing";
        li.textContent = `${s.kind}: ${cam}, reports ${rep}`;
        list.appendChild(li);
      }
    } else {
      srcs.style.display = "none";
    }
  } catch (e) {
    el.textContent = "The face helper is not running on this PC, so the rig cannot follow Reconize yet.";
    el.className = "statline err";
    srcs.style.display = "none";
  }
  setTimeout(pollWatcher, 3000);
}

load();
</script>
