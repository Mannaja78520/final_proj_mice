<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Remote &amp; Monitor — Mice</title>
<link rel="stylesheet" href="/mice.css">
<style>
.tv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-4);
}
.tv-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.tv-card h2 {
  font-size: 16px;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tv-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  font-weight: 600;
  text-transform: uppercase;
}
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-idle { background: var(--sunk); color: var(--mut); }
.badge-busy { background: var(--warn-soft); color: var(--warn); }
.now-playing-box {
  background: var(--sunk);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: var(--sp-3);
  text-align: center;
}
.now-playing-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--txt);
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}
.progress-bar-bg {
  width: 100%;
  height: 12px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
  margin: 10px 0 6px;
}
.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--acc);
  border-radius: 999px;
  transition: width 0.3s ease;
}
.btn-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: var(--sp-2);
}
.tv-btn {
  min-height: 48px;
  font-size: 15px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: var(--r-sm);
  cursor: pointer;
}
.tv-btn-primary { background: var(--acc); color: #fff; border: 0; }
.tv-btn-primary:hover { opacity: 0.9; }
.tv-btn-warn { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
.tv-btn-danger { background: var(--err-soft); color: var(--err); border: 1px solid var(--err); }
.seq-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: var(--sp-2);
  max-height: 260px;
  overflow-y: auto;
  padding: 4px;
}
.seq-pill {
  padding: 10px 12px;
  background: var(--sunk);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  font-size: 13.5px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.15s ease;
}
.seq-pill:hover {
  border-color: var(--acc);
  background: var(--acc-soft);
  color: var(--acc);
}
.joint-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px var(--sp-3);
  font-family: var(--mono);
  font-size: 12px;
}
.joint-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.joint-name { width: 56px; color: var(--mut); }
.joint-bar-bg {
  flex: 1;
  height: 8px;
  background: var(--line);
  border-radius: 4px;
  overflow: hidden;
}
.joint-bar-fill {
  height: 100%;
  width: 50%;
  background: var(--acc);
}
.joint-val { width: 34px; text-align: right; color: var(--txt); }
</style>
</head>
<body class="page">
<header class="topbar">
  <h1>📺 TV Remote &amp; Monitor</h1>
  <span class="mini" id="statBadge">connecting…</span>
  <button onclick="app.refresh()" style="margin-left:auto;">⟳ Refresh</button>
</header>

<div class="card" id="loginHere" style="margin-bottom:var(--sp-4)"></div>

<div class="tv-grid">
  <!-- Card 1: Player & Now Playing -->
  <div class="tv-card" style="grid-column: span 1;">
    <h2>
      <span>🎮 Show &amp; Move Controller</span>
      <span class="tv-badge badge-idle" id="playBadge">IDLE</span>
    </h2>

    <div class="now-playing-box">
      <div class="mini" style="color:var(--mut); margin-bottom:2px;">NOW PLAYING</div>
      <div class="now-playing-title" id="nowSeq">Ready</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="playProgress"></div>
      </div>
      <div class="mini" style="display:flex; justify-content:space-between; color:var(--mut);">
        <span id="curTime">0.0s</span>
        <span id="totTime">0.0s</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="tv-btn tv-btn-primary" onclick="app.resume()">▶ Play</button>
      <button class="tv-btn" onclick="app.pause()">⏸ Pause</button>
      <button class="tv-btn tv-btn-danger" onclick="app.stop()">⏹ Stop</button>
      <button class="tv-btn" onclick="app.goHome()">🏠 Home</button>
    </div>
  </div>

  <!-- Card 2: Quick Sequence Picker -->
  <div class="tv-card">
    <h2>
      <span>📂 Saved Sequences</span>
      <span class="mini" id="seqCount" style="color:var(--mut); font-weight:normal;">0 items</span>
    </h2>
    <div class="seq-list" id="seqList">
      <div class="mini" style="color:var(--mut); padding:8px;">Loading sequences…</div>
    </div>
  </div>

  <!-- Card 3: Quick Voice & Sound -->
  <div class="tv-card">
    <h2>
      <span>🗣️ Quick Speech &amp; Actions</span>
      <button class="tv-btn-danger" onclick="app.stopAllSound()" style="font-size:12px; padding:2px 8px; border-radius:4px;">Silenced All</button>
    </h2>
    <div class="btn-row" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));">
      <button class="tv-btn" onclick="app.speak('สวัสดีครับ')">🙏 สวัสดีครับ</button>
      <button class="tv-btn" onclick="app.speak('ยินดีต้อนรับครับ')">👋 ยินดีต้อนรับ</button>
      <button class="tv-btn" onclick="app.speak('ขอบคุณครับ')">✨ ขอบคุณครับ</button>
      <button class="tv-btn" onclick="app.speak('ขอให้มีความสุขนะครับ')">🎉 ขอให้มีความสุข</button>
    </div>
    <div style="display:flex; gap:8px; margin-top:8px;">
      <input type="text" id="customSpeak" placeholder="พิมพ์ข้อความให้หุ่นพูด…" style="flex:1; padding:8px 12px; border-radius:var(--r-sm); background:var(--sunk); border:1px solid var(--line);">
      <button class="tv-btn tv-btn-primary" onclick="app.speakCustom()" style="min-height:36px; padding:0 16px;">ส่งเสียง</button>
    </div>
  </div>

  <!-- Card 4: 10-Joint Monitor (Zero 3D) -->
  <div class="tv-card">
    <h2>
      <span>🦾 Joint Monitor (Real-time)</span>
      <span class="mini" style="color:var(--mut); font-weight:normal;">10 Servos</span>
    </h2>
    <div class="joint-grid" id="jointGrid">
      <!-- 10 Joint Rows injected dynamically -->
    </div>
  </div>
</div>

<script src="/mice.js"></script>
<script src="/mice-ui.js"></script>
<script>
"use strict";

const JOINTS = [
  "L_SH_P", "L_SH_R", "L_EL_P", "L_EL_R",
  "R_SH_P", "R_SH_R", "R_EL_P", "R_EL_R",
  "WAIST", "SHRUG"
];

class TVRemoteApp {
  constructor() {
    this.$ = id => document.getElementById(id);
    this.pollTimer = null;
    this.sequences = [];
    this.activeDev = "";
  }

  init() {
    this.buildJointRows();
    if (window.miceLogin) {
      window.miceLogin.mount(this.$("loginHere"));
    }
    this.loadSequences();
    this.poll();
    this.pollTimer = setInterval(() => this.poll(), 900);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        clearInterval(this.pollTimer);
        this.pollTimer = null;
      } else {
        this.poll();
        if (!this.pollTimer) this.pollTimer = setInterval(() => this.poll(), 900);
      }
    });
  }

  buildJointRows() {
    const grid = this.$("jointGrid");
    grid.innerHTML = "";
    JOINTS.forEach((j, i) => {
      const row = document.createElement("div");
      row.className = "joint-row";
      row.innerHTML = `
        <span class="joint-name">${j}</span>
        <div class="joint-bar-bg">
          <div class="joint-bar-fill" id="jbar_${i}" style="width: 50%;"></div>
        </div>
        <span class="joint-val" id="jval_${i}">90°</span>
      `;
      grid.appendChild(row);
    });
  }

  async refresh() {
    await this.loadSequences();
    await this.poll();
  }

  async loadSequences() {
    try {
      const res = await fetch("/api/list?kind=sequences");
      if (!res.ok) return;
      const data = await res.json();
      if (data && data.files) {
        this.sequences = data.files.filter(f => f.endsWith(".yaml"));
        this.renderSequences();
      }
    } catch (e) {
      console.warn("Failed to load sequences:", e);
    }
  }

  renderSequences() {
    const box = this.$("seqList");
    box.innerHTML = "";
    this.$("seqCount").textContent = this.sequences.length + " files";
    if (!this.sequences.length) {
      box.innerHTML = '<div class="mini" style="color:var(--mut);">No sequences found</div>';
      return;
    }
    this.sequences.forEach(name => {
      const btn = document.createElement("button");
      btn.className = "seq-pill";
      btn.textContent = name.replace(/\.yaml$/, "");
      btn.title = name;
      btn.onclick = () => this.playSequence(name);
      box.appendChild(btn);
    });
  }

  async poll() {
    try {
      // 1. Play status
      const playRes = await fetch("/api/play");
      if (playRes.ok) {
        const p = await playRes.json();
        this.updatePlayState(p);
      }

      // 2. Hardware / Modules status
      const stRes = await fetch("/api/status");
      if (stRes.ok) {
        const st = await stRes.json();
        this.updateHardwareState(st);
      }
    } catch (e) {
      this.$("statBadge").textContent = "offline";
    }
  }

  updatePlayState(p) {
    const badge = this.$("playBadge");
    const title = this.$("nowSeq");
    const fill = this.$("playProgress");
    const cur = this.$("curTime");
    const tot = this.$("totTime");

    if (p && p.running) {
      badge.textContent = "PLAYING";
      badge.className = "tv-badge badge-busy";
      title.textContent = p.name ? p.name.replace(/\.yaml$/, "") : "Active Move";
      const total = p.total || 1;
      const ms = p.ms || 0;
      const pct = Math.min(100, Math.round((ms / total) * 100));
      fill.style.width = pct + "%";
      cur.textContent = (ms / 1000).toFixed(1) + "s";
      tot.textContent = (total / 1000).toFixed(1) + "s";
    } else {
      badge.textContent = "IDLE";
      badge.className = "tv-badge badge-idle";
      if (title.textContent !== "Ready") {
        fill.style.width = "0%";
      }
    }
  }

  updateHardwareState(st) {
    if (!st) return;
    const mods = st.modules || [];
    const nong = mods.find(m => m.type === "nong") || mods[0];
    if (nong) {
      this.activeDev = nong.dev || ("usb:" + nong.port);
      this.$("statBadge").textContent = "🟢 " + (nong.name || "Nong") + " (" + (nong.ip || nong.dev || "online") + ")";
      if (nong.pose && Array.isArray(nong.pose)) {
        this.updateJoints(nong.pose);
      }
    } else {
      this.$("statBadge").textContent = "⚪ Waiting for modules";
    }
  }

  updateJoints(pose) {
    pose.forEach((deg, i) => {
      const bar = this.$("jbar_" + i);
      const val = this.$("jval_" + i);
      if (bar && val) {
        const pct = Math.max(0, Math.min(100, Math.round((deg / 180) * 100)));
        bar.style.width = pct + "%";
        val.textContent = Math.round(deg) + "°";
      }
    });
  }

  async playSequence(name) {
    try {
      this.$("nowSeq").textContent = "Starting " + name + "…";
      const res = await fetch("/api/seqsteps?name=" + encodeURIComponent(name));
      if (!res.ok) return;
      const data = await res.json();
      if (!data.steps) return;
      await fetch("/api/play", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          dev: this.activeDev || "auto",
          name: name,
          steps: data.steps,
          loop: false
        })
      });
      this.poll();
    } catch (e) {
      console.error("Play failed:", e);
    }
  }

  async stop() {
    await fetch("/api/play/stop", { method: "POST" });
    this.poll();
  }

  async pause() {
    await fetch("/api/play/stop", { method: "POST" });
    this.poll();
  }

  async resume() {
    if (this.sequences.length) {
      this.playSequence(this.sequences[0]);
    }
  }

  async goHome() {
    await this.stop();
    // Default neutral 90 degrees
    const flat90 = new Array(10).fill(90);
    await fetch("/api/play", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        dev: this.activeDev || "auto",
        name: "Home",
        steps: [{ pose: flat90, t: 1500, hold: 0 }],
        loop: false
      })
    });
    this.poll();
  }

  async speak(text) {
    if (!text) return;
    try {
      await fetch("/api/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      });
    } catch (e) {
      console.warn("Speak error:", e);
    }
  }

  speakCustom() {
    const inp = this.$("customSpeak");
    const txt = inp.value.trim();
    if (txt) {
      this.speak(txt);
      inp.value = "";
    }
  }

  async stopAllSound() {
    await fetch("/api/stream/stop", { method: "POST" });
  }
}

const app = new TVRemoteApp();
window.app = app;
document.addEventListener("DOMContentLoaded", () => app.init());
</script>
</body>
</html>
