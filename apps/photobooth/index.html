<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photobooth — Mice</title>
<link rel="stylesheet" href="/mice.css">
<script src="/mice.js"></script>

<script src="/mice-ui.js"></script>
<body class="page">

<!-- The head every page has (Mice.TopBar puts "← Hub" first and the
     technical switch last). -->
<header class="topbar">
  <h1>📸 Photobooth</h1>
  <span class="statline" id="stat">checking…</span>
  <span class="sub">guests take photos with a frame and stickers, and scan a QR code to keep them</span>
</header>

<!-- No hub login here: Photobooth has its own admin password. -->

<div class="card">
  <h2>Open the booth</h2>
  <p class="mini">Photobooth runs beside Mice on this PC. The first start also opens a
    browser tab that becomes the booth screen.</p>
  <div class="row" style="margin-bottom:var(--sp-3)">
    <button class="primary" id="boothBtn" onclick="booth.open('open', this)">Open booth screen ↗</button>
    <button id="adminBtn" onclick="booth.open('admin', this)">Open admin ↗</button>
    <button id="checkBtn" onclick="booth.check()">Check again</button>
  </div>
  <div class="statline tech mini" id="where"></div>
</div>

<script>
// Everything this page does is Mice.Partner (shared/web/mice-ui.js): the hub
// checks it, starts it with their own script, and the tab opens in the click.
const booth = new Mice.Partner("photobooth", {status: new Mice.Status("stat")});
booth.load().then(links => {
  if (!links) return;
  document.getElementById("where").textContent =
    "booth " + booth.url("open") + " · admin " + booth.url("admin") + " · folder " + (links.folder || "");
  booth.check();
});
</script>
