# Light CI gate (user 2026-11-26). Full QC (browser, serial, firmware) runs on the
# user's PC with run_qc.py; CI has no boards or GPU, so it only runs the checks that
# need no hardware. auto-merge.yml waits for this job, named "quick-qc".
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quick-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check_changelog diffs against origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python files compile
        run: python -m compileall -q main_python tools qc shared
      - name: Light QC checks (no hardware)
        # Names are matched against check files; see `python qc/run_qc.py --list`.
        run: python qc/run_qc.py --quiet changelog systems ref designer
