# Auto-merge (user 2026-11-26): squash-merge a PR into main when ALL hold:
#   - it has the label "auto-merge" and is not a draft, targets main
#   - its branch is in THIS repo (not a fork)
#   - the label was last added by the repo owner or claude[bot] (acting for them)
#   - the CI check "quick-qc" passed on the PR's latest commit
# The AI adds the label only after full QC is green on the PC. Remove the label to stop.
# Safe by design: pull_request_target runs this file from main, and it never checks out
# or runs PR code. It only calls the GitHub API.
name: Auto-merge
on:
  pull_request_target:
    types: [labeled, ready_for_review, synchronize, reopened]
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: read
concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'auto-merge';
            const REQUIRED = ['quick-qc'];
            const {owner, repo} = context.repo;
            const ALLOWED = [owner, 'claude[bot]'];

            // Which PRs does this event concern?
            let prs = [];
            if (context.payload.pull_request) {
              prs = [context.payload.pull_request];
            } else {
              const run = context.payload.workflow_run;
              if (run.conclusion !== 'success') return core.info('CI did not succeed: nothing to merge');
              const list = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', per_page: 100});
              prs = list.filter(p => p.head.sha === run.head_sha);
            }

            for (const p of prs) {
              const n = p.number;
              const skip = why => core.info(`#${n}: skipped, ${why}`);
              // Re-read: the event payload can be stale.
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: n});
              if (pr.state !== 'open') { skip('not open'); continue; }
              if (pr.draft) { skip('draft'); continue; }
              if (pr.base.ref !== 'main') { skip('base is not main'); continue; }
              if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) { skip('branch is from a fork'); continue; }
              if (!pr.labels.some(l => l.name === LABEL)) { skip('no auto-merge label'); continue; }

              // Who added the label last? Must be the owner or the owner's bot.
              const events = await github.paginate(github.rest.issues.listEvents, {owner, repo, issue_number: n, per_page: 100});
              const added = events.filter(e => e.event === 'labeled' && e.label && e.label.name === LABEL).pop();
              if (!added || !ALLOWED.includes(added.actor.login)) {
                skip(`label added by ${added ? added.actor.login : 'unknown'}, not an allowed user`); continue;
              }

              // Required checks must have succeeded on the latest commit.
              const runs = await github.paginate(github.rest.checks.listForRef, {owner, repo, ref: pr.head.sha, per_page: 100});
              const bad = REQUIRED.filter(name => !runs.some(r => r.name === name && r.conclusion === 'success'));
              if (bad.length) { skip(`waiting for checks: ${bad.join(', ')}`); continue; }

              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: n, merge_method: 'squash',
                  sha: pr.head.sha,                       // refuse if someone pushed since
                  commit_title: `${pr.title} (#${n})`,
                });
                core.info(`#${n}: merged`);
              } catch (e) {
                core.warning(`#${n}: merge refused: ${e.message}`);
                await github.rest.issues.createComment({owner, repo, issue_number: n,
                  body: `Auto-merge could not merge this PR: ${e.message}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`});
                continue;
              }
              try {
                await github.rest.git.deleteRef({owner, repo, ref: `heads/${pr.head.ref}`});
              } catch (e) { core.info(`branch delete skipped: ${e.message}`); }
            }
