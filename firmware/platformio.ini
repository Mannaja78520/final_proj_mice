; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lift_module]
framework = arduino
platform = espressif32@^6.5.0
board = nodemcu-32s
board_build.flash_mode = dio ;qio
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
; leave upload/monitor port auto-detected (was /dev/ttyUSB0)
; monitor_port = /dev/ttyUSB0
; upload_port = /dev/ttyUSB0
upload_protocol = esptool
monitor_filters = esp32_exception_decoder
; deep+ evaluates conditional #includes (YAMLDuino only compiles its
; ArduinoJson bindings when it can see <ArduinoJson.h>)
lib_ldf_mode = deep+
lib_deps =
	madhephaestus/ESP32Servo@^1.1.2
	madhephaestus/ESP32Encoder@^0.11.7
	Wire
	SPI
	adafruit/Adafruit Unified Sensor@^1.1.4
	adafruit/Adafruit BusIO@^1.16.1
	esphome/AsyncTCP-esphome@^2.1.4
	esphome/ESPAsyncWebServer-esphome@^3.2.2
	bblanchon/ArduinoJson@^7.0.4
	fastled/FastLED@^3.6.0
	earlephilhower/ESP8266Audio@^1.9.7
	tobozo/YAMLDuino@^1.4.2
build_flags =
	-I config
	; make ArduinoJson visible while YAMLDuino itself is compiled, so its
	; __has_include(<ArduinoJson.h>) guard enables the JsonDocument bindings
	-I .pio/libdeps/lift_module/ArduinoJson/src
	-D __PGMSPACE_H_
	-D USE_ESP32_CONFIG
	; -D CORE_DEBUG_LEVEL=5
