; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:mice_module_firmware]
; Regenerate the C++ tables from config/*.json before compiling, so the data
; lives in one human-editable file while the chip still gets a plain static
; array — no JSON parsing on the ESP32, no runtime cost.
extra_scripts = pre:tools/gen_tables.py
framework = arduino
platform = espressif32@^6.5.0
board = nodemcu-32s
board_build.flash_mode = dio ;qio
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
; leave upload/monitor port auto-detected (was /dev/ttyUSB0)
; monitor_port = /dev/ttyUSB0
; upload_port = /dev/ttyUSB0
upload_protocol = esptool
monitor_filters = esp32_exception_decoder
; deep+ evaluates conditional #includes (YAMLDuino only compiles its
; ArduinoJson bindings when it can see <ArduinoJson.h>)
lib_ldf_mode = deep+
lib_deps =
	madhephaestus/ESP32Servo@^1.1.2
	madhephaestus/ESP32Encoder@^0.11.7
	Wire
	SPI
	adafruit/Adafruit Unified Sensor@^1.1.4
	adafruit/Adafruit BusIO@^1.16.1
	esphome/AsyncTCP-esphome@^2.1.4
	esphome/ESPAsyncWebServer-esphome@^3.2.2
	bblanchon/ArduinoJson@^7.0.4
	fastled/FastLED@^3.6.0
	earlephilhower/ESP8266Audio@^1.9.7
	tobozo/YAMLDuino@^1.4.2
build_flags =
	-I config
	; make ArduinoJson visible while YAMLDuino itself is compiled, so its
	; __has_include(<ArduinoJson.h>) guard enables the JsonDocument bindings
	-I .pio/libdeps/mice_module_firmware/ArduinoJson/src
	-D __PGMSPACE_H_
	-D USE_ESP32_CONFIG
	; -D CORE_DEBUG_LEVEL=5

; Runs the nong's pure maths on the PC — no board, no servos, no Arduino.
; Only src/modules/nong/NongMath.h is compiled (it deliberately has no
; hardware dependency), so `pio test -e native` is seconds, not minutes, and
; QC can execute the logic instead of only reading it.
; Needs a HOST compiler (g++/clang) on PATH — PlatformIO only ships the xtensa
; cross-compiler, which builds for the ESP32 and cannot run on the PC. Without
; one, QC reports these tests as unavailable rather than pretending they passed.
; On Windows the usual fix is MSYS2/MinGW-w64 or Build Tools for Visual Studio.
[env:native]
platform = native
test_framework = unity
test_filter = test_logic      ; test/esp32_sketches needs real hardware
lib_ignore = Encoder, esp32_Encoder, motor, PIDF, Utilize   ; project libraries are Arduino-only; NongMath.h stands alone
build_flags =
	-I src
	-I config
	-std=c++17

