; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; ---------------------------------------------------------------------------
; ONE BINARY PER MODULE TYPE
; ---------------------------------------------------------------------------
; A board only ever runs ONE module type, but for a long time every board
; carried every type: a nong flashed the lift's motor code, the RGB strip, the
; MP3 decoder and the lift's web cards, and a lift carried the nong's servo
; code and joint sliders. Measured 2026-08-07: 74.9% of flash used and the same
; 43.9 KB page served by every board, with a camera type still to come.
;
; So the type is chosen at BUILD time now:
;
;     pio run -e mice_nong           the humanoid
;     pio run -e mice_lift           the lift
;     pio run -e mice_blank          core only (identity/WiFi/SD/RS485)
;     pio run -e mice_module_firmware  every type in one binary (legacy)
;
; What changes per env is only which module folder compiles and which
; `-D MICE_TYPE_*` is set; everything else is shared in [mice_base] so the
; envs cannot drift apart. tools/gen_tables.py reads that flag and generates
; the command table and the web page for THAT type only, so the wrong module's
; controls are absent from the binary rather than hidden by JavaScript.
;
; The legacy all-types env is kept while the split proves itself on the bench;
; nothing depends on it except QC's own build check.
; ---------------------------------------------------------------------------

[mice_base]
; Regenerate the C++ tables from config/*.json before compiling, so the data
; lives in one human-editable file while the chip still gets a plain static
; array — no JSON parsing on the ESP32, no runtime cost. The same script also
; writes this env's web page and adds the generated folder to the include path.
extra_scripts = pre:tools/gen_tables.py
framework = arduino
platform = espressif32@^6.5.0
board = nodemcu-32s
board_build.flash_mode = dio ;qio
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
; leave upload/monitor port auto-detected (was /dev/ttyUSB0)
; monitor_port = /dev/ttyUSB0
; upload_port = /dev/ttyUSB0
upload_protocol = esptool
monitor_filters = esp32_exception_decoder
; deep+ evaluates conditional #includes (YAMLDuino only compiles its
; ArduinoJson bindings when it can see <ArduinoJson.h>)
lib_ldf_mode = deep+
; Every module type needs these: identity, web portal, SD, sequences.
lib_deps =
	Wire
	SPI
	esphome/AsyncTCP-esphome@^2.1.4
	esphome/ESPAsyncWebServer-esphome@^3.2.2
	bblanchon/ArduinoJson@^7.0.4
	tobozo/YAMLDuino@^1.4.2
build_flags =
	-I config
	-D __PGMSPACE_H_
	-D USE_ESP32_CONFIG
	; -D CORE_DEBUG_LEVEL=5
	; ArduinoJson's own folder is added by tools/gen_tables.py — it lives under
	; .pio/libdeps/<env>/, so it cannot be written as a fixed path here without
	; being wrong for every env but one.

; ---- the humanoid: servos, no motor, no RGB, no speaker -------------------
[env:mice_nong]
extends = mice_base
build_src_filter = +<*> -<modules/lift/> -<modules/cam/> -<core/RgbStrip.cpp> -<core/AudioPlayer.cpp>
build_flags = ${mice_base.build_flags} -D MICE_TYPE_NONG
lib_deps =
	${mice_base.lib_deps}
	madhephaestus/ESP32Servo@^1.1.2

; ---- the lift: motor, encoder, limit switches, RGB strip, speaker ---------
[env:mice_lift]
extends = mice_base
build_src_filter = +<*> -<modules/nong/> -<modules/cam/>
build_flags = ${mice_base.build_flags} -D MICE_TYPE_LIFT
lib_deps =
	${mice_base.lib_deps}
	madhephaestus/ESP32Servo@^1.1.2
	madhephaestus/ESP32Encoder@^0.11.7
	fastled/FastLED@^3.6.0
	earlephilhower/ESP8266Audio@^1.9.7

; ---- the camera: an ESP32-CAM, a different board entirely -----------------
; AI-Thinker ESP32-CAM. Its own board definition (PSRAM, and the pins the
; camera is etched onto), but the SAME core: identity, WiFi, RS485, SD,
; sequences, OTA. It can never be a servo module — between the camera and the
; SD card there is no usable GPIO left — which is exactly why it is a type of
; its own rather than an option on another one.
; The board's own default is huge_app.csv (one 3 MB app, no OTA). We keep
; min_spiffs.csv so this board updates over WiFi like every other.
[env:mice_cam]
extends = mice_base
board = esp32cam
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<modules/lift/> -<modules/nong/> -<core/RgbStrip.cpp> -<core/AudioPlayer.cpp>
; PSRAM IS DELIBERATELY OFF. Measured on a real AI-Thinker board: with
; BOARD_HAS_PSRAM set, ANY large HTTP response kills the board — the async
; server's send buffer is allocated from PSRAM on the AsyncTCP task and the
; allocator faults on a nonsense size. It is not the camera: GET / (the 31 KB
; module page) died exactly the same way, while the identical firmware core
; serves that page happily on a board without PSRAM.
; The cost is frame size — QVGA/VGA instead of SVGA and up, and one frame
; buffer instead of two. The gain is a camera module whose website works.
; Re-enable it only with a real board and a page load to prove it.
build_flags = ${mice_base.build_flags} -D MICE_TYPE_CAM -UBOARD_HAS_PSRAM

; ---- core only: a board that is not a module yet --------------------------
; Flash it, give it an identity over USB, then flash the type it turned out to
; be. Also the honest floor measurement: everything a module type must pay for.
[env:mice_blank]
extends = mice_base
build_src_filter = +<*> -<modules/lift/> -<modules/nong/> -<modules/cam/> -<core/RgbStrip.cpp> -<core/AudioPlayer.cpp>
build_flags = ${mice_base.build_flags} -D MICE_TYPE_BLANK

; ---- every type in one binary (the build as it was before the split) ------
; Kept until the per-type builds have run on the bench. No -D MICE_TYPE_*,
; which is what tells the generator "carry everything".
[env:mice_module_firmware]
extends = mice_base
; cam is deliberately NOT here: it is a different board (esp32cam), so "every
; type in one binary" cannot include it. The per-type builds are the answer.
build_src_filter = +<*> -<modules/cam/>
build_flags = ${mice_base.build_flags} -D MICE_TYPE_LIFT -D MICE_TYPE_NONG
lib_deps =
	${mice_base.lib_deps}
	madhephaestus/ESP32Servo@^1.1.2
	madhephaestus/ESP32Encoder@^0.11.7
	adafruit/Adafruit Unified Sensor@^1.1.4
	adafruit/Adafruit BusIO@^1.16.1
	fastled/FastLED@^3.6.0
	earlephilhower/ESP8266Audio@^1.9.7

; Runs the nong's pure maths on the PC — no board, no servos, no Arduino.
; Only src/modules/nong/NongMath.h is compiled (it deliberately has no
; hardware dependency), so `pio test -e native` is seconds, not minutes, and
; QC can execute the logic instead of only reading it.
; Needs a HOST compiler (g++/clang) on PATH — PlatformIO only ships the xtensa
; cross-compiler, which builds for the ESP32 and cannot run on the PC. Without
; one, QC reports these tests as unavailable rather than pretending they passed.
; On Windows the usual fix is MSYS2/MinGW-w64 or Build Tools for Visual Studio.
[env:native]
platform = native
test_framework = unity
test_filter = test_logic      ; test/esp32_sketches needs real hardware
lib_ignore = Encoder, esp32_Encoder, motor, PIDF, Utilize   ; project libraries are Arduino-only; NongMath.h stands alone
build_flags =
	-I src
	-I config
	-std=c++17
