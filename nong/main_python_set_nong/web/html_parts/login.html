    <div class="card" data-stab="login" id="loginCard" style="display:none;">
      <h2>Login Required</h2>
      <div class="mini">Log in for the settings that move or change the real robot. Posing, sequencing and the settings below this box need no login.</div>
      <div class="row" style="margin-top:12px;">
        <span class="lbl">Username</span><input id="loginUser" style="flex:1">
      </div>
      <div class="row">
        <span class="lbl">Password</span><input id="loginPass" type="password" style="flex:1" onkeydown="if(event.key==='Enter') appLogin()">
      </div>
      <div class="row">
        <button class="primary" onclick="appLogin()">Log in</button>
      </div>
      <div id="loginStat" class="err"></div>
    </div>
