  <!-- The Video tab's stage (A44-8): the person, their music and the skeleton
       found on them, beside the 3D robot. Shown only while that tab is open
       (body.vidpage); app_parts/video_page.js keeps the two in step. -->
  <div id="vidStage">
    <div class="vidbox">
      <video id="vidPlayer" hidden playsinline controls></video>
      <canvas id="vidOverlay" aria-hidden="true"></canvas>
      <p class="vidempty" id="vidEmpty">Pick a video or paste a link on the right.</p>
    </div>
    <div class="row vidplay">
      <button class="primary" id="vidPlayBtn" onclick="vidPlayBoth()" disabled
              title="Plays the video with its sound, and the robot beside it does the moves made from it.">▶ Play person and robot</button>
      <label><input type="checkbox" id="vidSkel" checked onchange="vidLastMs = -1">
        Skeleton</label>
      <span class="mini" id="vidClock"></span>
    </div>
  </div>
  <div id="viewport">
    <div id="collideWarn">⚠ joints collide — the robot would crash</div>
    <div id="viewCube" title="click a view to look straight at that plane and drag joints in it (like Fusion/SolidWorks)">
      <button id="viewCubeBtn" class="vc-toggle" aria-expanded="false" onclick="viewCubeOpen()"
              title="show the view buttons: Top, Front, 3D…">Views ▾</button>
      <div class="vcRow"><button data-view="top" onclick="setView('top')">Top</button></div>
      <div class="vcRow">
        <button data-view="left" onclick="setView('left')">Left</button>
        <button data-view="front" onclick="setView('front')">Front</button>
        <button data-view="right" onclick="setView('right')">Right</button>
        <button data-view="back" onclick="setView('back')">Back</button>
      </div>
      <div class="vcRow">
        <button data-view="bottom" onclick="setView('bottom')">Bottom</button>
        <button data-view="iso" class="on" onclick="setView('iso')">3D</button>
      </div>
      <div class="vcRow">
        <button id="distBtn" aria-pressed="false" onclick="distSet(!distOn)"
                title="show distances in mm: elbow to hand, elbow to elbow, hand to hand, shoulder to elbow and shoulder to hand. Hold D to see them only while held.">📏 Distances</button>
      </div>
      <!-- A48-1 robot look: the choices come from urdf_view.json (urdf_view.js) -->
      <div class="vcRow vcLook">
        <label for="lookSel" class="mini">Robot look</label>
        <select id="lookSel" onchange="setLook(this.value)"
                title="Simple shapes = the old robot sized in Rig setup. CAD model = the URDF file at its real sizes."></select>
        <select id="lookModel" hidden onchange="urdfPickModel(this.value)" title="which CAD model file"></select>
      </div>
      <div class="vcRow"><span class="mini" id="lookStat" role="status"></span></div>
      <div class="vcRow"><span class="mini tech" id="lookTech"></span></div>
      <div class="vcRow" id="lookHandMarksRow" hidden>
        <label class="mini" title="The flat hand Studio draws at each wrist (skin = palm, grey = back). The CAD hand already shows the palm, so it can be hidden.">
          <input type="checkbox" id="lookHandMarks" onchange="urdfSetHandMarks(this.checked)"> Show the drawn hands</label>
      </div>
      <!-- A48-6: the simple shapes made from the CAD (rig_from_cad.js) -->
      <div class="vcRow">
        <button id="rigCadMake" hidden onclick="rigFromCad()"
                title="The arm lengths and where each shoulder sits are taken from the CAD model. The servo numbers and your joints stay as they are.">Use the CAD's sizes and shoulder spots</button>
        <button id="rigCadBack" hidden onclick="rigOldBack()"
                title="Puts back the simple shapes you had before they were made from the CAD.">Put my old shapes back</button>
      </div>
      <div class="vcRow"><span class="mini" id="rigCadStat" role="status"></span></div>
    </div>
  </div>
  <!-- A48-1: leaving the CAD look asks whose sizes the simple shapes use -->
  <dialog id="lookAsk" aria-labelledby="lookAskTitle">
    <h2 id="lookAskTitle">Back to the simple shapes: which sizes?</h2>
    <p><button class="primary" id="lookUseCad">Use the CAD's sizes and shoulder spots</button>
      <span class="mini">arm lengths and where each shoulder sits from the CAD, your joints kept; the old shapes are kept too</span></p>
    <p><button id="lookUseUrdf">Use the CAD model's sizes</button>
      <span class="mini" id="lookAskUrdf"></span></p>
    <p><button id="lookUseMine">Use my own sizes</button>
      <span class="mini" id="lookAskMine"></span></p>
    <p><button id="lookStay">Stay on the CAD model</button></p>
  </dialog>
