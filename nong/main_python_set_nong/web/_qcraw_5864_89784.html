<script>
window.alert=function(){}; window.confirm=function(){return true;};
// A report that does not arrive fails the check for a reason that has nothing
// to do with the code under test. This used to be a bare .catch(){} — one
// dropped fetch and a measurement simply vanished, so the suite failed at
// random under load and passed when run alone. A suite that fails randomly is
// one people learn to ignore.
//
// So a mark RETRIES. The port behind it is a single fake serial line shared by
// every mark, and under load a request can be refused; four attempts spaced
// 150 ms apart cover that without hiding a real failure, because a mark that
// never lands after all four still fails the check.
window.qcMark=function(m, tries){
  tries = tries || 0;
  return fetch("/api/usb/cmd?port=COM99&id=0&c=" +
               encodeURIComponent("MOVE QCMARK " + m))
    .then(function(r){ if (!r || !r.ok) throw new Error("mark refused"); })
    .catch(function(){
      // THE CABLE IS SHARED, AND THE HUB USES IT TOO. Its own port probe holds
      // the fake port for up to 5.4 s (an RS485 census), and while it does,
      // every mark is refused with "Access is denied". Four tries over 600 ms
      // gave up inside that window, so the page reported NOTHING and the check
      // said "[]" - which reads as a dead page (A26-94, 2026-09-23: identity,
      // loop_return and modsite_back, all green alone).
      // 40 tries x 250 ms outlasts the census; a page that truly cannot talk
      // still fails the check, just later.
      // KEEP TRYING UNTIL THE PAGE'S OWN WINDOW ENDS. 10 s was still not
      // enough on 2026-09-23: check_loop_return reported nothing at all
      // while the hub held the cable for a longer stretch. 400 x 250 ms
      // is 100 s, inside the page window + grace, so a mark lands as soon
      // as the cable frees and a page that truly cannot talk still fails.
      if (tries >= 400) return;
      return new Promise(function(go){ setTimeout(go, 250); })
        .then(function(){ return window.qcMark(m, tries + 1); });
    });
};
window.qcFail=function(e){ qcMark("ERROR-" + String(e && e.message || e)
  .replace(/[^A-Za-z0-9]/g,"_").slice(0,60)); };
// Wait for something to BE TRUE, not for a number of milliseconds. A fixed
// sleep is a bet on how fast the machine is today: under load the page has not
// finished, the driver measures an empty list, and the check reports a bug
// that does not exist. Returns true if the condition came good, false if the
// deadline passed, so the caller can say what it was waiting for and a real
// failure still fails.
window.qcWaitFor = function(cond, ms, step){
  ms = ms || 8000; step = step || 100;
  return new Promise(function(done){
    var until = Date.now() + ms;
    (function poll(){
      var ok = false;
      try{ ok = !!cond(); }catch(e){ ok = false; }
      if (ok) return done(true);
      if (Date.now() > until) return done(false);
      setTimeout(poll, step);
    })();
  });
};
</script>

<style>html,body{margin:0}#f{width:1100px;height:900px;border:0}</style>
<iframe id="f" src="/"></iframe>
<script>
async function done(s){ await qcMark("NET " + s); qcMark("done"); }   // report lands before "done"
window.addEventListener("load", async function(){
  try{
    var d = document.getElementById('f').contentDocument;
    var out = [];
    // The hub page scans for modules as it loads, and the scan takes as long
    // as it takes. Measuring after a fixed pause is a race the suite lost on
    // three separate runs — wait for the page to be ready instead.
    await qcWaitFor(function(){
      return d.querySelector('#tabs .tab[data-go="network"]')
          && d.querySelectorAll('#netlist input[type=checkbox]').length > 0;
    // 40s, not 15. This waits on a full probe of every cable, and under a
    // parallel gate that is slow: the tab asks /api/scan, then /api/ports,
    // then opens each port with /api/scanusb. When the wait expired the check
    // reported "it lists the modules it can find (0)", which reads as the tab
    // being broken. It was not - it had not finished looking. Failed that way
    // in the gate on 2026-08-20 and passed alone every time.
    // 55s since 2026-08-28: the same failure came back when the suite grew to
    // 159 checks (A24-19 added two browser ones to the same three workers).
    // The whole check takes 57s alone, so 40s of it was never going to be
    // enough under load. Patience raised; nothing it asserts has changed.
    }, 55000);
    var btn = d.querySelector('#tabs .tab[data-go="network"]');
    out.push("tabbtn=" + (btn ? "yes" : "no"));
    var card = d.querySelector('[data-tab="network"]');
    out.push("hiddenfirst=" + (card && card.style.display === "none" ? "yes" : "no"));
    if (btn) btn.click();
    setTimeout(function(){
      out.push("shown=" + (card && card.style.display !== "none" ? "yes" : "no"));
      // switching tabs may only HIDE — the module lists are live and must survive
      out.push("modskept=" + (d.getElementById("mods") ? "yes" : "no"));
      out.push("usbkept=" + (d.getElementById("usbmods") ? "yes" : "no"));
      setTimeout(function(){
        var boxes = d.querySelectorAll("#netlist input[type=checkbox]");
        out.push("rows=" + boxes.length);
        // WHY there are no rows, when there are none. The page shows a
        // spinner while it is still looking and replaces it with a sentence
        // once it has an answer, so its own state tells the difference
        // between "found nothing" and "had not finished" - and reporting the
        // first when the second is true is the check lying about the product.
        var nl = d.getElementById("netlist");
        out.push("still=" + (nl && /spin/.test(nl.className) ? "yes" : "no"));
        if (boxes.length) {
          boxes[0].checked = true;
          boxes[0].dispatchEvent(new Event("change", {bubbles:true}));
          var f = d.getElementById("grpname");
          out.push("form=" + (f ? "yes" : "no"));
          if (f) {
            f.value = "qcgroup";
            d.querySelector("#netact button").click();
          }
        }
        setTimeout(function(){ done(out.join(" ")); }, 5000);
      }, 6000);
    }, 800);
  } catch (e) { done("ERR=" + String(e).slice(0, 60)); }
});
</script>
