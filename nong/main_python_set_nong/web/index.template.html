<!doctype html>
<!-- Nong Studio's MAP (A41-4). index.html is BUILT from this file and
     html_parts/ by tools/build_web.py: edit a part, never index.html.
     One part per area: header, view (3D + view buttons), login, pose,
     sequence, video, robot, shows, setup, timeline. A new part is a new file plus
     one line here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nong Studio — pose &amp; sequence editor</title>
<link rel="stylesheet" href="/mice.css">
<link rel="stylesheet" href="style.css">
</head>
<!-- app: a viewport-and-panel layout, not a centred column. The shared
     big-screen rule in mice.css scales columns on a wall screen and
     deliberately leaves this alone - scaling a 3D canvas and its drag
     maths is a different question, and Studio is used at a desk. -->
<body class="app">
<!-- part: header.html -->
<div id="main">
<!-- part: view.html -->

  <div id="sideDrag" title="drag to make the panel wider or narrower"></div>

  <div id="side">
    <div id="sideTabs" class="tabs equal">
      <!-- Task tabs. The old Movement/Setup split put the robot link, the SD
           card and the zero calibration all in "Movement", so posing meant
           scrolling past things you only touch once. ids kept so nothing else
           changes. -->
      <button class="tab on" id="tabBtnMove" onclick="showTab('pose')">Pose</button>
      <button class="tab" id="tabBtnSeq" onclick="showTab('sequence')">Sequence</button>
      <button class="tab" id="tabBtnVideo" onclick="showTab('video')">Video</button>
      <button class="tab" id="tabBtnShows" onclick="showTab('shows')">Shows</button>
      <button class="tab" id="tabBtnRobot" onclick="showTab('robot')">Robot</button>
      <button class="tab" id="tabBtnSetup" onclick="showTab('setup')">Setup</button>
    </div>

    <!-- SOMETHING WENT WRONG, WHEREVER YOU WERE LOOKING. Each card has its own
         status line, which is right for routine chatter but wrong for a
         failure: the message lands in the Robot card while you are posing, and
         the monitor loop overwrites it a second later anyway. Both were real -
         `USB disconnected` was written into a hidden card and erased by the
         next poll before anyone could read it.
         So failures come here instead: always visible, and only ever written by
         notice(), never by a polling loop. -->
    <div id="notice" class="banner err" hidden role="alert" aria-live="assertive">
      <span id="noticeText"></span>
      <button onclick="clearNotice()" title="dismiss">&times;</button>
    </div>

<!-- part: login.html -->

    <div id="tabMove">
<!-- part: pose.html -->

<!-- part: sequence.html -->

<!-- part: talk.html -->

<!-- part: video.html -->

<!-- part: robot.html -->

<!-- part: shows.html -->
    </div><!-- /tabMove -->

    <div id="tabSetup" style="display:none">
<!-- part: setup.html -->

    </div><!-- /tabSetup -->
  </div>
</div>

<div id="timeDrag" title="drag to make the timeline taller or shorter"></div>
<!-- part: timeline.html -->

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/STLLoader.js"></script>
<!-- the tuned rig, served by the hub; empty if none has been saved yet -->
<!-- The shared script: the theme picker, and the ONE list of connection
     states every mice screen answers with. Studio was the only screen
     not loading it, so it had its own vocabulary for being connected -
     and its own silence about what to do when it was not. -->
<!-- Help about THIS editor, not the top of the whole page. -->
<a class="tab tab-link" href="/help#studio" target="_blank"
   style="position:fixed;right:12px;bottom:12px;z-index:20"
   title="Help about Nong Studio">Help &#8599;</a>
<script src="/mice.js"></script>
<script src="/mice-ui.js"></script>
<script src="/rig_default.js"></script>
<script src="app.js"></script>
</body>
</html>
