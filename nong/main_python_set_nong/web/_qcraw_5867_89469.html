<script>
window.alert=function(){}; window.confirm=function(){return true;};
// A report that does not arrive fails the check for a reason that has nothing
// to do with the code under test. This used to be a bare .catch(){} — one
// dropped fetch and a measurement simply vanished, so the suite failed at
// random under load and passed when run alone. A suite that fails randomly is
// one people learn to ignore.
//
// So a mark RETRIES. The port behind it is a single fake serial line shared by
// every mark, and under load a request can be refused; four attempts spaced
// 150 ms apart cover that without hiding a real failure, because a mark that
// never lands after all four still fails the check.
window.qcMark=function(m, tries){
  tries = tries || 0;
  return fetch("/api/usb/cmd?port=COM99&id=0&c=" +
               encodeURIComponent("MOVE QCMARK " + m))
    .then(function(r){ if (!r || !r.ok) throw new Error("mark refused"); })
    .catch(function(){
      // THE CABLE IS SHARED, AND THE HUB USES IT TOO. Its own port probe holds
      // the fake port for up to 5.4 s (an RS485 census), and while it does,
      // every mark is refused with "Access is denied". Four tries over 600 ms
      // gave up inside that window, so the page reported NOTHING and the check
      // said "[]" - which reads as a dead page (A26-94, 2026-09-23: identity,
      // loop_return and modsite_back, all green alone).
      // 40 tries x 250 ms outlasts the census; a page that truly cannot talk
      // still fails the check, just later.
      // KEEP TRYING UNTIL THE PAGE'S OWN WINDOW ENDS. 10 s was still not
      // enough on 2026-09-23: check_loop_return reported nothing at all
      // while the hub held the cable for a longer stretch. 400 x 250 ms
      // is 100 s, inside the page window + grace, so a mark lands as soon
      // as the cable frees and a page that truly cannot talk still fails.
      if (tries >= 400) return;
      return new Promise(function(go){ setTimeout(go, 250); })
        .then(function(){ return window.qcMark(m, tries + 1); });
    });
};
window.qcFail=function(e){ qcMark("ERROR-" + String(e && e.message || e)
  .replace(/[^A-Za-z0-9]/g,"_").slice(0,60)); };
// Wait for something to BE TRUE, not for a number of milliseconds. A fixed
// sleep is a bet on how fast the machine is today: under load the page has not
// finished, the driver measures an empty list, and the check reports a bug
// that does not exist. Returns true if the condition came good, false if the
// deadline passed, so the caller can say what it was waiting for and a real
// failure still fails.
window.qcWaitFor = function(cond, ms, step){
  ms = ms || 8000; step = step || 100;
  return new Promise(function(done){
    var until = Date.now() + ms;
    (function poll(){
      var ok = false;
      try{ ok = !!cond(); }catch(e){ ok = false; }
      if (ok) return done(true);
      if (Date.now() > until) return done(false);
      setTimeout(poll, step);
    })();
  });
};
</script>
<h1>wrapper</h1><script>
// WCAG AA text contrast of everything visible in a document. contrastAudit(doc) -> ["<ratio> <text> [<element>]"]
// for text below 4.5:1 (3:1 at 18px and up). Shared by qc/checks/check_theme_contrast.py.
function contrastAudit(doc) {
  var win = doc.defaultView;
  function parse(c) {
    var m = c.match(/rgba?\(([^)]+)\)/);
    if (m) { var p = m[1].split(",").map(Number); return {r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1}; }
    var s = c.match(/color\(srgb ([^)]+)\)/);
    if (s) { var q = s[1].split(/[ \/]+/).map(Number); return {r: q[0] * 255, g: q[1] * 255, b: q[2] * 255, a: q.length > 3 ? q[3] : 1}; }
    return {r: 0, g: 0, b: 0, a: 0};
  }
  function lum(c) {
    function f(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b);
  }
  function bgOf(e) {
    var stack = [];
    for (var n = e; n; n = n.parentElement) stack.push(win.getComputedStyle(n).backgroundColor);
    var base = {r: 255, g: 255, b: 255};
    for (var i = stack.length - 1; i >= 0; i--) {
      var c = parse(stack[i]);
      if (c.a > 0) base = {r: base.r * (1 - c.a) + c.r * c.a, g: base.g * (1 - c.a) + c.g * c.a, b: base.b * (1 - c.a) + c.b * c.a};
    }
    return base;
  }
  var out = [], seen = {}, all = doc.querySelectorAll("button,a,label,span,p,h1,h2,h3,td,div,b,i,small");
  for (var k = 0; k < all.length; k++) {
    var e = all[k];
    if (e.children.length > 0 && !/^(BUTTON|A)$/.test(e.tagName)) continue;
    var t = (e.textContent || "").trim();
    if (!t || t.length > 60) continue;
    var cs = win.getComputedStyle(e);
    if (cs.visibility === "hidden" || cs.display === "none" || !e.getClientRects().length || +cs.opacity < 0.5 || e.disabled) continue;
    var fg = parse(cs.color), bg = bgOf(e);
    var mix = {r: fg.r * fg.a + bg.r * (1 - fg.a), g: fg.g * fg.a + bg.g * (1 - fg.a), b: fg.b * fg.a + bg.b * (1 - fg.a)};
    var a = lum(mix), b = lum(bg), r = (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
    if (r < (parseFloat(cs.fontSize) >= 18 ? 3 : 4.5)) {
      var key = t.slice(0, 28);
      if (!seen[key]) { seen[key] = 1; out.push(r.toFixed(2) + " " + key + " [" + String(e.id || e.className || e.tagName).slice(0, 24) + "]"); }
    }
  }
  return out;
}

var PAGES = [{"id": "home", "url": "/", "wait": null}, {"id": "help", "url": "/help", "wait": null}, {"id": "studio", "url": "/studio/", "wait": 4000}, {"id": "tv", "url": "/app/tv/", "wait": null}, {"id": "camera", "url": "/app/camera/", "wait": null}, {"id": "voice", "url": "/app/voice/", "wait": null}, {"id": "gacha", "url": "/app/gacha/", "wait": null}], THEMES = ["indigo", "midnight", "daylight", "carnival", "aurora", "cloudy", "cream"];
function ready(f){ return qcWaitFor(function(){ try { var d = f.contentDocument; return d.readyState === "complete" && d.body && d.body.innerText.length > 20; } catch (e) { return false; } }, 20000); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function run(){
  localStorage.setItem("mice.lang", "en");
  for (var ti = 0; ti < THEMES.length; ti++) {
    localStorage.setItem("mice_theme", THEMES[ti]);
    for (var pi = 0; pi < PAGES.length; pi++) {
      var f = document.createElement("iframe");
      f.style.cssText = "width:1200px;height:800px";
      document.body.appendChild(f);
      f.src = PAGES[pi].url;
      await ready(f); await sleep(PAGES[pi].wait || 1200);
      try {
        var bad = contrastAudit(f.contentDocument);
        qcMark("CONTRAST~" + THEMES[ti] + "~" + PAGES[pi].id + "~" + bad.length + "~" + (bad[0] || "").replace(/[^a-zA-Z0-9.]/g, "_").slice(0, 40));
      } catch (e) { qcMark("ERR~" + PAGES[pi].id); }
      f.remove();
    }
  }
  qcMark("done");
}
window.addEventListener("load", function(){ run(); });
</script>
