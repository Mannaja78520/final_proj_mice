<script>
window.alert=function(){}; window.confirm=function(){return true;};
// A report that does not arrive fails the check for a reason that has nothing
// to do with the code under test. This used to be a bare .catch(){} — one
// dropped fetch and a measurement simply vanished, so the suite failed at
// random under load and passed when run alone. A suite that fails randomly is
// one people learn to ignore.
//
// So a mark RETRIES. The port behind it is a single fake serial line shared by
// every mark, and under load a request can be refused; four attempts spaced
// 150 ms apart cover that without hiding a real failure, because a mark that
// never lands after all four still fails the check.
window.qcMark=function(m, tries){
  tries = tries || 0;
  return fetch("/api/usb/cmd?port=COM99&id=0&c=" +
               encodeURIComponent("MOVE QCMARK " + m))
    .then(function(r){ if (!r || !r.ok) throw new Error("mark refused"); })
    .catch(function(){
      // THE CABLE IS SHARED, AND THE HUB USES IT TOO. Its own port probe holds
      // the fake port for up to 5.4 s (an RS485 census), and while it does,
      // every mark is refused with "Access is denied". Four tries over 600 ms
      // gave up inside that window, so the page reported NOTHING and the check
      // said "[]" - which reads as a dead page (A26-94, 2026-09-23: identity,
      // loop_return and modsite_back, all green alone).
      // 40 tries x 250 ms outlasts the census; a page that truly cannot talk
      // still fails the check, just later.
      // KEEP TRYING UNTIL THE PAGE'S OWN WINDOW ENDS. 10 s was still not
      // enough on 2026-09-23: check_loop_return reported nothing at all
      // while the hub held the cable for a longer stretch. 400 x 250 ms
      // is 100 s, inside the page window + grace, so a mark lands as soon
      // as the cable frees and a page that truly cannot talk still fails.
      if (tries >= 400) return;
      return new Promise(function(go){ setTimeout(go, 250); })
        .then(function(){ return window.qcMark(m, tries + 1); });
    });
};
window.qcFail=function(e){ qcMark("ERROR-" + String(e && e.message || e)
  .replace(/[^A-Za-z0-9]/g,"_").slice(0,60)); };
// Wait for something to BE TRUE, not for a number of milliseconds. A fixed
// sleep is a bet on how fast the machine is today: under load the page has not
// finished, the driver measures an empty list, and the check reports a bug
// that does not exist. Returns true if the condition came good, false if the
// deadline passed, so the caller can say what it was waiting for and a real
// failure still fails.
window.qcWaitFor = function(cond, ms, step){
  ms = ms || 8000; step = step || 100;
  return new Promise(function(done){
    var until = Date.now() + ms;
    (function poll(){
      var ok = false;
      try{ ok = !!cond(); }catch(e){ ok = false; }
      if (ok) return done(true);
      if (Date.now() > until) return done(false);
      setTimeout(poll, step);
    })();
  });
};
</script>

<style>body{margin:0;background:#111}iframe{border:0;display:block}</style>
<script>
var PAGES = ["/", "/help", "/studio/", "/mod?dev=usb%3ACOM99", "/rgb.html", "/o/", "/o/rgb.html", "/o/studio/", "/g/", "/g/rgb.html", "/g/studio/", "/app/tv/", "/app/camera/", "/app/voice/", "/app/gacha/", "/app/ai-status/"], DEVS = [[320, 658], [360, 780], [390, 844], [768, 1024], [1024, 768], [1280, 800], [1920, 1080], [2560, 1440], [3840, 2160]], LANES = 6;
function measure(url, w, h){
  return new Promise(function(res){
    var f = document.createElement("iframe");
    f.width = w; f.height = h; f.src = url;
    document.body.appendChild(f);
    f.onload = function(){
      // WAIT FOR THE FRAME TO BE READABLE, do not bet 1400 ms on it. In a full
      // gate on 2026-09-23 this read a null document - "/help at 320px could be
      // measured - Cannot read properties of null" - and passed alone (A26-94).
      // onload fires before the document inside is finished in a loaded
      // browser, so the measurement met nothing and blamed the layout.
      qcWaitFor(function(){
        var dd = f.contentDocument;
        return dd && dd.readyState === "complete" && dd.body && dd.body.scrollWidth > 0;
      // 12 s, and it RETRIES the frame once. At 2560 and 3840 px a frame
      // under a full gate was still not complete after 5 s, so the measurement
      // read a null document and the check reported "could not be measured"
      // (A26-94, 2026-09-23). The page window covers it: the budget check does
      // that arithmetic.
      }, 12000).then(function(ok){
        if (!ok) {   // one more chance, from a fresh frame
          f.src = url;
          return qcWaitFor(function(){
            var dd = f.contentDocument;
            return dd && dd.readyState === "complete" && dd.body && dd.body.scrollWidth > 0;
          }, 12000);
        }
        return true;
      }).then(function(){
      // ...then a short settle for fonts and any boot script
      setTimeout(function(){
        var out = {url:url, w:w, over:-1, tallest:"", used:-1,
                   small:-1, tiny:-1, tinyWhat:""};
        try{
          var d = f.contentDocument, de = d.documentElement;
          out.over = Math.max(de.scrollWidth, d.body ? d.body.scrollWidth : 0) - w;
          // HOW MUCH OF THE SCREEN THE PAGE ACTUALLY FILLS. Overflow is the
          // fault at 320px; the opposite is the fault at 4K, where a
          // max-width layout leaves a column of text down the middle of three
          // metres of glass. Measured as the widest visible block, because a
          // centred column's own width is what a person sees.
          var right = 0, left = w;
          d.querySelectorAll("body *").forEach(function(el){
            var r = el.getBoundingClientRect();
            if (r.width < 40 || r.height < 10) return;   // ignore slivers
            var st = f.contentWindow.getComputedStyle(el);
            if (st.display === "none" || st.visibility === "hidden") return;
            if (r.right > right) right = r.right;
            if (r.left < left) left = r.left;
          });
          out.used = Math.max(0, Math.round(right - Math.max(0, left)));
          // TWO MORE THINGS A SCREENSHOT AT ONE WIDTH CANNOT SHOW.
          // The smallest text somebody has to READ, and the smallest control
          // they have to HIT. Both are per width: a page can be fine on a
          // laptop and unusable on the phone it is opened on at the venue.
          var small = 99, tiny = 999, tinyWhat = "", smallWhat = "";
          d.querySelectorAll("body *").forEach(function(el){
            var r = el.getBoundingClientRect();
            if (r.width < 1 || r.height < 1) return;
            var st = f.contentWindow.getComputedStyle(el);
            if (st.display === "none" || st.visibility === "hidden") return;
            var txt = (el.textContent || "").trim();
            var own = el.children.length === 0 && txt.length > 3;
            if (own) {
              var px = parseFloat(st.fontSize) || 99;
              if (px < small) {
                small = px;
                // NAME IT. Chasing a size through four stylesheets by hand is
                // how an afternoon goes; the measurement already knows.
                smallWhat = el.tagName.toLowerCase() +
                  (el.id ? "#" + el.id : "") +
                  (el.className && typeof el.className === "string" && el.className
                    ? "." + el.className.split(" ")[0] : "");
              }
            }
            // A CONTROL, not any link. An <a> inside a paragraph is text
            // that happens to be clickable, and holding prose to a 36px touch
            // target would mean no prose. Links that are dressed as controls -
            // .tab, .btn - count, because they are aimed at like buttons.
            var isCtl = /^(button|select|input|textarea)$/i.test(el.tagName) ||
                        (el.tagName === "A" &&
                         /(tab|btn|primary)/.test(el.className || ""));
            if (isCtl) {
              var h = Math.round(r.height);
              if (h > 0 && h < tiny) {
                tiny = h;
                tinyWhat = el.tagName.toLowerCase() + (el.id ? "#" + el.id : "");
              }
            }
          });
          out.small = Math.round(small);
          out.smallWhat = smallWhat;
          out.tiny = (tiny === 999) ? -1 : tiny;
          out.tinyWhat = tinyWhat;
          if (out.over > 0) {           // name the widest offender, to fix it
            var worst = 0;
            d.querySelectorAll("*").forEach(function(el){
              var r = el.getBoundingClientRect();
              if (r.right > worst) { worst = r.right;
                out.tallest = el.tagName.toLowerCase() +
                  (el.id ? "#" + el.id : "") +
                  (el.className && el.className.baseVal === undefined && el.className
                    ? "." + String(el.className).split(" ")[0] : ""); }
            });
          }
        }catch(e){ out.over = -2; out.tallest = String(e.message||e).slice(0,40); }
        f.remove();
        res(out);
      }, 400);
      });
    };
  });
}
window.addEventListener("load", async function(){
  try{
    // SEVERAL IFRAMES AT ONCE. One at a time was 169 s of an 540 s gate
    // (2026-09-17). Each iframe has its own width and its own layout, so they
    // do not disturb each other's measurement; results keep their order.
    var jobs = [];
    for (var i = 0; i < PAGES.length; i++)
      for (var j = 0; j < DEVS.length; j++) jobs.push([PAGES[i], DEVS[j][0], DEVS[j][1]]);
    var results = new Array(jobs.length), next = 0;
    async function lane(){
      while (next < jobs.length){
        var k = next++;
        results[k] = await measure(jobs[k][0], jobs[k][1], jobs[k][2]);
      }
    }
    var lanes = [];
    for (var n = 0; n < LANES; n++) lanes.push(lane());
    await Promise.all(lanes);
    // report in chunks: one command line stays well inside an RS485 frame
    for (var k = 0; k < results.length; k++) {
      var r = results[k];
      // AWAIT each report. These go to the module over one serial port that
      // takes one caller at a time; firing 25 of them 30ms apart built a
      // backlog that timed out under load, and the check then failed with
      // "measurements missing" — pointing at a layout bug that did not exist.
      await qcMark("R|" + r.url + "|" + r.w + "|" + r.over + "|" + r.tallest +
                   "|" + r.used + "|" + r.small + "|" + r.tiny + "|" + r.tinyWhat +
                   "|" + r.smallWhat);
    }
    qcMark("done");
  }catch(e){ qcFail(e); }
});
</script>
