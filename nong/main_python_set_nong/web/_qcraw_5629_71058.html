<script>
window.alert=function(){}; window.confirm=function(){return true;};
// A report that does not arrive fails the check for a reason that has nothing
// to do with the code under test. This used to be a bare .catch(){} — one
// dropped fetch and a measurement simply vanished, so the suite failed at
// random under load and passed when run alone. A suite that fails randomly is
// one people learn to ignore.
//
// So a mark RETRIES. The port behind it is a single fake serial line shared by
// every mark, and under load a request can be refused; four attempts spaced
// 150 ms apart cover that without hiding a real failure, because a mark that
// never lands after all four still fails the check.
window.qcMark=function(m, tries){
  tries = tries || 0;
  return fetch("/api/usb/cmd?port=COM99&id=0&c=" +
               encodeURIComponent("MOVE QCMARK " + m))
    .then(function(r){ if (!r || !r.ok) throw new Error("mark refused"); })
    .catch(function(){
      // THE CABLE IS SHARED, AND THE HUB USES IT TOO. Its own port probe holds
      // the fake port for up to 5.4 s (an RS485 census), and while it does,
      // every mark is refused with "Access is denied". Four tries over 600 ms
      // gave up inside that window, so the page reported NOTHING and the check
      // said "[]" - which reads as a dead page (A26-94, 2026-09-23: identity,
      // loop_return and modsite_back, all green alone).
      // 40 tries x 250 ms outlasts the census; a page that truly cannot talk
      // still fails the check, just later.
      // KEEP TRYING UNTIL THE PAGE'S OWN WINDOW ENDS. 10 s was still not
      // enough on 2026-09-23: check_loop_return reported nothing at all
      // while the hub held the cable for a longer stretch. 400 x 250 ms
      // is 100 s, inside the page window + grace, so a mark lands as soon
      // as the cable frees and a page that truly cannot talk still fails.
      if (tries >= 400) return;
      return new Promise(function(go){ setTimeout(go, 250); })
        .then(function(){ return window.qcMark(m, tries + 1); });
    });
};
window.qcFail=function(e){ qcMark("ERROR-" + String(e && e.message || e)
  .replace(/[^A-Za-z0-9]/g,"_").slice(0,60)); };
// Wait for something to BE TRUE, not for a number of milliseconds. A fixed
// sleep is a bet on how fast the machine is today: under load the page has not
// finished, the driver measures an empty list, and the check reports a bug
// that does not exist. Returns true if the condition came good, false if the
// deadline passed, so the caller can say what it was waiting for and a real
// failure still fails.
window.qcWaitFor = function(cond, ms, step){
  ms = ms || 8000; step = step || 100;
  return new Promise(function(done){
    var until = Date.now() + ms;
    (function poll(){
      var ok = false;
      try{ ok = !!cond(); }catch(e){ ok = false; }
      if (ok) return done(true);
      if (Date.now() > until) return done(false);
      setTimeout(poll, step);
    })();
  });
};
</script>
<h1>wrapper</h1><script>
// What a person notices at a glance, as numbers. One function, shared by the screenshot tool
// (tools/visual/shoot.js) and the QC check (check_visual_language.py), so they cannot disagree.
// attr = tooltips/placeholders/labels still in English.
// latin = plain English words still showing (only meaningful in zh/ja).
// visualProbe(doc) -> {thai: [visible Thai texts], overflowX, stuck: [dialogs pinned at the top-left]}
function visualProbe(doc) {
  var win = doc.defaultView, r = { thai: [], overflowX: doc.documentElement.scrollWidth > win.innerWidth + 2, stuck: [], latin: [], attr: [] };
  var w = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT), n;
  while ((n = w.nextNode())) {
    var t = n.nodeValue.trim(), e = n.parentElement;
    if (!t || !e || /^(SCRIPT|STYLE|OPTION|TEXTAREA)$/.test(e.tagName)) continue;
    var tl = t.replace(/^[^A-Za-z]+/, "").replace(/[^A-Za-z.)]+$/, "");   // an icon or a colon in front/behind is not text
    if (!/[\u0E00-\u0E7F\u3040-\u30ff\u4e00-\u9fff]/.test(t) && /^[A-Za-z][A-Za-z ,.'()\/-]{2,}$/.test(tl) && win.getComputedStyle(e).display !== "none" && e.getClientRects().length && !e.closest("[data-user-text],code,pre,.tech,.adv")) r.latin.push(t.slice(0, 160));
    if (/[฀-๿]/.test(t)) {
      var cs = win.getComputedStyle(e);
      if (cs.visibility !== "hidden" && cs.display !== "none" && e.getClientRects().length && !e.closest("[data-user-text]")) r.thai.push(t.slice(0, 60));
    }
  }
  var at = doc.querySelectorAll("[placeholder],[title],[aria-label]");
  for (var a = 0; a < at.length; a++) {
    var el = at[a];
    if (!el.getClientRects().length || el.closest("[data-user-text],.tech,.adv")) continue;
    ["placeholder", "title", "aria-label"].forEach(function (k) {
      var v = (el.getAttribute(k) || "").trim();
      if (v && /^[A-Za-z][A-Za-z ,.'()\/\u2014-]{5,}/.test(v) && !/[\u0E00-\u0E7F\u3040-\u30ff\u4e00-\u9fff]/.test(v)) r.attr.push(k + ": " + v.slice(0, 100));
      if (/[\u0E00-\u0E7F]/.test(v)) r.thai.push(k + ": " + v.slice(0, 60));
    });
  }
  var sel = "dialog[open],[role=dialog],.modal,.popup,.popover,.sheet,[class*=dialog],[class*=popup]";
  var list = doc.querySelectorAll(sel);
  for (var i = 0; i < list.length; i++) {
    var d = list[i], b = d.getBoundingClientRect(), c2 = win.getComputedStyle(d);
    if (c2.display === "none" || c2.visibility === "hidden" || !b.width) continue;
    if (b.left < 4 && b.top < 4 && (c2.position === "fixed" || c2.position === "absolute")) r.stuck.push((d.className || d.tagName) + "@" + Math.round(b.left) + "," + Math.round(b.top));
  }
  return r;
}

var ALLOW = ["^Sure!"], LALLOW = ["^(Nong Studio|Studio|Reconize|Mice Hub|Mice|Google Sheet|Wi-?Fi|USB|CPU|GPU|RAM|OK)$", "^(far-)?nong(-[a-z]+)?$", "^nong-far$", "^(Kooo|Looo+ng\\w*|NONO|NookYung|SeiyngSung|VongSungKhwa|WonderWomen|all|all\\.yaml|all move|hello|my move|tangVongSungLeft|yakyai)$", "^this PC$", "^(or use the|view buttons|stays|pause|only where you want the robot to stand still\\.|monitor|live)$", "\\.yaml$", "(Nong Studio|All-Jao Games|Photobooth|Google Sheet)$", "^[\u00b7\\s]*CPU\\b", "^Sources:$", "COMMANDS\\.md", "Reconize$", "^qc[_a-z0-9 ]*$"], PAGES = [{"id": "home", "url": "/", "wait": null, "latin": true, "tabs": [null, "showTab('tools')", "showTab('modules')", "showTab('firmware')", "showTab('network')", "showTab('settings')", "showTab('complaints')"]}, {"id": "hub", "url": "/hub", "wait": null, "latin": true, "tabs": [null]}, {"id": "help", "url": "/help", "wait": null, "latin": true, "tabs": [null]}, {"id": "studio", "url": "/studio/", "wait": 4000, "latin": true, "tabs": [null]}, {"id": "tv", "url": "/app/tv/", "wait": null, "latin": true, "tabs": [null]}, {"id": "camera", "url": "/app/camera/", "wait": null, "latin": true, "tabs": [null]}, {"id": "voice", "url": "/app/voice/", "wait": null, "latin": true, "tabs": [null]}, {"id": "gacha", "url": "/app/gacha/", "wait": null, "latin": true, "tabs": [null]}, {"id": "module", "url": "/mod?dev=usb:COM99:67&name=nong-far", "wait": null, "latin": false, "tabs": [null]}], LANGS = ["th", "en", "zh", "ja"];
function ready(f){ return qcWaitFor(function(){ try { var d = f.contentDocument; return d.readyState === "complete" && d.body && d.body.innerText.length > 20; } catch (e) { return false; } }, 20000); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function run(){
  for (var li = 0; li < LANGS.length; li++) {
    localStorage.setItem("mice.lang", LANGS[li]);
    for (var pi = 0; pi < PAGES.length; pi++) {
      var pg = PAGES[pi], f = document.createElement("iframe");
      f.style.cssText = "width:1200px;height:800px";
      document.body.appendChild(f);
      f.src = pg.url;
      await ready(f); await sleep(pg.wait || 1500);
      var tabs = pg.tabs || [null];
      for (var ti = 0; ti < tabs.length; ti++) {
        try {
          if (tabs[ti]) { f.contentWindow.eval(tabs[ti]); await sleep(700); }
          var r = visualProbe(f.contentDocument);
          var bad = r.thai.filter(function(s){ return !ALLOW.some(function(a){ return new RegExp(a).test(s); }); });
          qcMark("THAI~" + LANGS[li] + "~" + pg.id + (tabs[ti] ? "~" + ti : "") + "~" + bad.length + "~" + (bad[0] || "").replace(/[^\u0E00-\u0E7Fa-zA-Z0-9]/g, "_").slice(0, 24));
          var lat = pg.latin === false ? [] : r.latin.filter(function(s){ return !LALLOW.some(function(a){ return new RegExp(a).test(s); }); });
          qcMark("LATIN~" + LANGS[li] + "~" + pg.id + (tabs[ti] ? "~" + ti : "") + "~" + lat.length + "~" + (lat[0] || "").replace(/[^a-zA-Z0-9]/g, "_").slice(0, 30));
          var at = r.attr.filter(function(s){ return !LALLOW.some(function(a){ return new RegExp(a).test(s.replace(/^[a-z-]+: /, "")); }); });
          qcMark("ATTR~" + LANGS[li] + "~" + pg.id + "~" + at.length);
          qcMark("STUCK~" + LANGS[li] + "~" + pg.id + "~" + r.stuck.length);
        } catch (e) { qcMark("ERR~" + pg.id + "~" + String(e).slice(0, 40).replace(/[^a-zA-Z0-9]/g, "_")); }
      }
      f.remove();
    }
  }
  // phone width: no page may scroll sideways (a hand cannot reach what sits past the edge)
  localStorage.setItem("mice.lang", "en");
  for (var qi = 0; qi < PAGES.length; qi++) {
    var f2 = document.createElement("iframe");
    f2.style.cssText = "width:390px;height:800px";
    document.body.appendChild(f2);
    f2.src = PAGES[qi].url;
    await ready(f2); await sleep(PAGES[qi].wait || 1500);
    try {
      var d2 = f2.contentDocument;
      qcMark("PHONEW~" + PAGES[qi].id + "~" + (d2.documentElement.scrollWidth - 390));
    } catch (e) { qcMark("ERR~phone~" + PAGES[qi].id); }
    f2.remove();
  }
  qcMark("done");
}
window.addEventListener("load", function(){ run(); });
</script>
