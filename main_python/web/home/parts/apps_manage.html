  <div class="card" data-tab="tools" id="apps-manage">
    <h2>แอปในเครื่องนี้</h2>
    <p class="mini">เครื่องนี้มีแอปไหนบ้าง การถอดแค่ซ่อนแอปจากเครื่องนี้ ไม่ลบไฟล์</p>
    <div class="row">
      <button id="apps-check" type="button" class="primary">เช็กอัปเดต</button>
      <button id="apps-toggle" type="button" aria-expanded="false" aria-controls="apps-addbox">เพิ่มแอป…</button>
    </div>
    <div id="apps-say" class="mini" aria-live="polite"></div>
    <div id="apps-addbox" hidden>
      <div class="row">
        <input id="apps-folder" type="text" placeholder="โฟลเดอร์ของแอป" aria-label="โฟลเดอร์ของแอป" style="flex:1;min-width:12em">
        <button id="apps-pick" type="button">เลือกโฟลเดอร์…</button>
        <button id="apps-add" type="button" class="primary">เพิ่มแอป</button>
      </div>
      <h3>เจอในเครื่องนี้ ยังไม่ได้เพิ่ม</h3>
      <div id="apps-found" class="js-apps-found">กำลังหา…</div>
    </div>
    <div id="apps-list" class="js-apps-list">กำลังโหลด…</div>
  </div>
