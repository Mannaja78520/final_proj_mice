<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mice — which equation each part uses</title>
<style>
/* Same design system as the rest of the product, copied rather than linked for
   the same reason docs/PLAN.html copies it: this has to open from a USB stick
   with no server at all, and a file:// page may not link a stylesheet next to
   it. Tokens are PLAN.html's, unchanged - the two documents sit side by side
   and must not drift apart. */
:root{
  --bg:#10141a; --card:#1a212b; --sunk:#0d1117; --line:#2a3442;
  --txt:#dce3ec; --mut:#8b98a9; --btn:#243040;
  --acc:#4da3ff; --on-acc:#06121f;
  --ok:#3ecf8e; --warn:#ffb454; --err:#ff6b6b;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font:15px/1.6 system-ui,Segoe UI,Roboto,sans-serif;
  padding:var(--sp-6);max-width:1100px;margin:0 auto;overflow-x:hidden}
h1{font-size:26px;margin-bottom:var(--sp-1)}
h2{font-size:15px;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;
   margin:var(--sp-6) 0 var(--sp-3)}
h3{font-size:18px;margin:0 0 var(--sp-1)}
p{margin-bottom:var(--sp-2)}
a{color:var(--acc)}
.sub{color:var(--mut);margin-bottom:var(--sp-4)}

/* the search bar stays put, because 20-odd entries is more than one screen */
.find{position:sticky;top:0;z-index:2;background:var(--bg);
  padding:var(--sp-3) 0;margin-bottom:var(--sp-2);
  border-bottom:1px solid var(--line);display:flex;gap:var(--sp-2);
  align-items:center;flex-wrap:wrap}
.find input{flex:1;min-width:200px;background:var(--sunk);color:var(--txt);
  border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px var(--sp-3);font:inherit}
.find input:focus{outline:2px solid var(--acc);outline-offset:1px}
.count{color:var(--mut);font-size:13px}

.card{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:var(--sp-4);margin:var(--sp-3) 0}
.where{display:flex;flex-direction:column;gap:2px;margin-top:var(--sp-3)}
.where a{font-size:13px;font-family:ui-monospace,Consolas,monospace;
  text-decoration:none;word-break:break-all}
.where span{color:var(--mut)}

/* An equation is read character by character, so it gets a monospace block and
   its own scroll - never a line that pushes the page sideways. */
pre{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:var(--sp-3);margin:var(--sp-2) 0;overflow-x:auto;
  font:14px/1.7 ui-monospace,Consolas,monospace;color:var(--txt);
  white-space:pre;-webkit-overflow-scrolling:touch}
var{font-style:normal;color:var(--acc)}
sub,sup{font-size:.75em;color:var(--mut)}

.tag{display:inline-block;font-size:11px;text-transform:uppercase;
  letter-spacing:.05em;padding:2px 8px;border-radius:var(--r-pill);
  border:1px solid var(--line);color:var(--mut);margin-bottom:var(--sp-2)}
.watch,.from{font-size:13px;border-left:2px solid var(--line);
  padding-left:var(--sp-3);margin-top:var(--sp-2);color:var(--mut)}
.watch{border-left-color:var(--warn)}
.watch b,.from b{color:var(--txt);font-weight:600}

.empty{color:var(--mut);padding:var(--sp-6) 0;text-align:center}

@media (max-width:520px){
  body{padding:var(--sp-3)}
  h1{font-size:21px}
  pre{font-size:12.5px}
}
@media (pointer:coarse){
  .find input{min-height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<h1>Which equation each part uses</h1>
<p class="sub">Every piece of maths this robot runs on, what it is for, and the
real file and line it lives at. Open this file directly — it needs no server.</p>

<div class="find">
  <label for="q" style="position:absolute;left:-9999px">Search the reference</label>
  <input id="q" type="search" placeholder="Search — try servo, speed, PID, WiFi, sound"
         autocomplete="off">
  <span class="count" id="count" aria-live="polite"></span>
</div>

<main id="list"></main>

<script src="ref_data.js"></script>
<script>
// The entries are DATA (ref_data.js). This only draws them, so adding the next
// one never touches this file.
var list = document.getElementById("list");
var q = document.getElementById("q");
var count = document.getElementById("count");

function esc(s) {
  return String(s == null ? "" : s).replace(/[<>]/g, function (c) {
    return c === "<" ? "&lt;" : "&gt;";
  });
}

function draw(filter) {
  var f = (filter || "").trim().toLowerCase();
  list.innerHTML = "";
  var shown = 0, group = "";
  (window.REF || []).forEach(function (e) {
    var hay = [e.name, e.group, e.eq, e.why, e.from, e.watch,
               (e.where || []).map(function (w) { return w.file + " " + w.what; }).join(" ")]
              .join(" ").toLowerCase();
    if (f && hay.indexOf(f) < 0) return;
    shown++;
    if (e.group !== group) {
      group = e.group;
      var h = document.createElement("h2");
      h.textContent = group;
      list.appendChild(h);
    }
    var card = document.createElement("article");
    card.className = "card";
    card.id = e.id;
    // e.eq and e.why are written in this repo, not typed by a visitor, and
    // carry deliberate entities (&pi;, <sub>). The FILE PATHS are escaped.
    var html = "<h3>" + esc(e.name) + "</h3>"
             + "<pre>" + e.eq + "</pre>"
             + "<p>" + e.why + "</p>";
    if (e.from)  html += '<p class="from"><b>Comes from:</b> ' + e.from + "</p>";
    if (e.watch) html += '<p class="watch"><b>Careful:</b> ' + e.watch + "</p>";
    html += '<div class="where">';
    (e.where || []).forEach(function (w) {
      html += '<a href="../' + esc(w.file) + '">' + esc(w.file) + ":" + esc(w.line)
            + "</a><span>" + esc(w.what) + "</span>";
    });
    html += "</div>";
    card.innerHTML = html;
    list.appendChild(card);
  });
  if (!shown) {
    var none = document.createElement("p");
    none.className = "empty";
    none.textContent = f
      ? 'Nothing matches "' + f + '". Try a plainer word — speed, sound, servo, bus.'
      : "ref_data.js did not load. It must sit in this same folder.";
    list.appendChild(none);
  }
  count.textContent = shown + " of " + (window.REF || []).length;
}

q.addEventListener("input", function () { draw(q.value); });
draw("");
</script>
</body>
</html>
